# 014: geolocation/autocomplete/map-pick/walk. Movement and arrival are e2e-owned.
[[check]]
ac = "AC-1"
kind = "location_denied"
viewport = "desktop"
note = "denied geolocation asks for the start location (StartLocationModal)"

[[check]]
ac = "AC-3"
kind = "exists"
selector = "button[aria-label='Pick start on map']"
viewport = "both"

[[check]]
ac = "AC-4"
kind = "route_request"
selector = "input[placeholder='e.g. Englischer Garten']"
value = "Englischer Garten"
viewport = "desktop"

[[check]]
ac = "AC-5"
kind = "route_request"
selector = "input[placeholder='e.g. Englischer Garten']"
value = "Marienplatz, Munich"
origin = "Englischer Garten"
viewport = "desktop"
note = "A distinct pair, so the app's same-pair guard does not suppress the request"

[[check]]
ac = "AC-2"
kind = "route_request"
selector = "input[placeholder='e.g. Englischer Garten']"
value = "Englischer Garten"
viewport = "desktop"
note = "a route so Start is enabled"

[[check]]
ac = "AC-2"
kind = "click"
selector = "[data-testid='start-walk']"
viewport = "desktop"

[[check]]
ac = "AC-2"
kind = "count"
selector = ".walk-person-marker"
expect = 1
viewport = "desktop"
note = "exactly one walker marker (the pre-walk marker must not stack)"

[[check]]
ac = "AC-2"
kind = "exists"
selector = ".walk-person-marker svg"
viewport = "desktop"
note = "the walker marker is the inlined person-walking glyph"

[[check]]
ac = "AC-6"
kind = "geo_step"
selector = ".walk-person-marker"
value = "0.001,0.001"
viewport = "desktop"
note = "a new geolocation fix moves the marker"

[[check]]
ac = "AC-8"
kind = "no_match"
value = "pk."
viewport = "desktop"
note = "the Mapbox token is backend-only: no token prefix in the page or its resources"

[[not_applicable]]
ac = "AC-7"
note = "arrival needs walking into the radius; the e2e suite drives the fix sequence"

[[not_applicable]]
ac = "AC-9"
note = "gates/documentation"
