# 005 AC-1: save -> list -> recall -> delete needs the local Postgres.
# `make accept-live` runs this only when DATABASE_URL is up.
[target]
kind = "local"
requires_db = true

[[check]]
ac = "AC-1"
kind = "live_route"
selector = "input[placeholder='e.g. Englischer Garten']"
value = "Englischer Garten"
viewport = "desktop"
note = "plan a route so the save CTA is offered"

[[check]]
ac = "AC-1"
kind = "click"
selector = "[data-testid='save-route']"
viewport = "desktop"
note = "041: the route card's save button replaces section.walk"

[[check]]
ac = "AC-1"
kind = "click"
selector = "[data-testid='saved-walks']"
viewport = "desktop"
note = "041: saved routes live in the nav dialog"

[[check]]
ac = "AC-1"
kind = "wait_for"
selector = "[data-testid='saved-walks-dialog'] .dialog-list li"
viewport = "desktop"
note = "the saved route appears in the list"

[[check]]
ac = "AC-1"
kind = "exists"
selector = "[data-testid='saved-walks-dialog'] .saved-name"
viewport = "desktop"
note = "the saved name is rendered"

[[check]]
ac = "AC-1"
kind = "click"
selector = "[data-testid='saved-walks-dialog'] button:has-text('Recall')"
viewport = "desktop"
note = "recall the saved route"

[[check]]
ac = "AC-1"
kind = "wait_for"
selector = "section.route-summary .duration"
viewport = "desktop"
note = "recall restores the scored route card"

[[check]]
ac = "AC-1"
kind = "text"
selector = "section.route-summary .best-fit"
expect = "Best fit"
viewport = "desktop"
note = "the restored card is the honest route card"

[[check]]
ac = "AC-1"
kind = "click"
selector = "[data-testid='saved-walks']"
viewport = "desktop"
note = "reopen the dialog after recall closes it"

[[check]]
ac = "AC-1"
kind = "click"
selector = "[data-testid='saved-walks-dialog'] button:has-text('Delete')"
viewport = "desktop"
note = "delete the saved route"

[[check]]
ac = "AC-1"
kind = "wait_for"
selector = "[data-testid='saved-walks-dialog'] .empty"
viewport = "desktop"
note = "the list is empty after delete"

[[check]]
ac = "AC-1"
kind = "text"
selector = "[data-testid='saved-walks-dialog']"
expect = "No saved walks yet."
viewport = "desktop"
note = "the empty state is honest"
