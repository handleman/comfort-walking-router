# 040 / 041: deterministic layout contract.
#
# The 041 redesign keeps the same regions and test ids but changes where the
# endpoint card lives: on desktop it sits inside the 380px planning panel (top
# nav above it), on mobile it floats over the map. The map stays full-bleed and
# the sidebar/drawer never coexist.
#
# Read by swarm/acceptance.py against the two viewports (desktop 1280x800,
# mobile 390x844) from getBoundingClientRect — no screenshots, no vision.

[region.top-nav]
selector = "[data-testid='top-nav']"
ac       = "AC-3"

[region.top-card]
selector = "[data-testid='top-card']"
anchor   = "top-left"
ac       = "AC-2"

[region.map]
selector = "[data-testid='map']"
ac       = "AC-1"

[region.sidebar]
selector = "[data-testid='sidebar']"
ac       = "AC-3"

[region.drawer]
selector = "[data-testid='drawer']"
ac       = "AC-3"

[control.origin-input]
selector = "[data-testid='origin-input']"
regions  = ["top-card"]
ac       = "AC-2"

[control.dest-input]
selector = "[data-testid='dest-input']"
regions  = ["top-card"]
ac       = "AC-2"

# The mobile sheet auto-opens once a route exists; this contract is measured on
# the initial load, so the start button is asserted on the desktop panel.
[control.start-walk]
selector = "[data-testid='start-walk']"
regions  = ["sidebar", "drawer"]
viewports = ["desktop"]
unique   = true
ac       = "AC-4"

# 041 moves the legend onto the map (bottom-left), outside the panel.
[control.comfort-legend]
selector = "[data-testid='comfort-legend']"
regions  = ["map"]
viewports = ["desktop"]
ac       = "AC-7"

[expect.desktop]
visible_regions = ["top-nav", "top-card", "map", "sidebar"]
hidden_regions  = ["drawer"]

[expect.mobile]
visible_regions = ["top-card", "map", "drawer"]
hidden_regions  = ["sidebar", "top-nav"]

[tolerance]
px      = 2
overlap = 0
