# 007: the start of a walk is an interaction the stand can drive; the rest
# (drift, arrival, auto-center) needs a moving fix sequence and stays with the
# e2e suite.
[[check]]
ac = "AC-1"
kind = "route_request"
selector = "input[placeholder='e.g. Englischer Garten']"
value = "Englischer Garten"
viewport = "desktop"

[[check]]
ac = "AC-1"
kind = "click"
selector = "[data-testid='start-walk']"
viewport = "desktop"

[[check]]
ac = "AC-1"
kind = "wait_for"
selector = ".walk-stop:not([disabled])"
viewport = "desktop"

[[not_applicable]]
ac = "AC-2"
note = "simulated movement needs a walk session over time"

[[not_applicable]]
ac = "AC-3"
note = "permission denial needs the browser permission harness"

[[not_applicable]]
ac = "AC-4"
note = "sustained drift needs a moving fix sequence"

[[not_applicable]]
ac = "AC-5"
note = "reroute-query interaction"

[[not_applicable]]
ac = "AC-6"
note = "auto-center toggle interaction"

[[not_applicable]]
ac = "AC-7"
note = "arrival needs walking into the radius"

[[not_applicable]]
ac = "AC-8"
note = "pytest/ruff/mypy gates"
