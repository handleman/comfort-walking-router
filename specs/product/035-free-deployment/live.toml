# 035 AC-1/AC-2: the public deployment is the subject. `make accept-live`
# drives the Render URL (HTTPS, cold start tolerated). AC-3 (a real phone GPS
# walk) stays a human device action.
[target]
kind = "remote"
url = "https://comfort-walking-router.onrender.com/"

[[check]]
ac = "AC-1"
kind = "exists"
selector = "#map"
viewport = "desktop"
note = "the public URL serves the built app"

[[check]]
ac = "AC-1"
kind = "min_count"
selector = ".leaflet-tile"
expect = 1
viewport = "desktop"
note = "map tiles render from the public origin"

[[check]]
ac = "AC-1"
kind = "text"
selector = "body"
expect = "Comfort Walking Router"
viewport = "desktop"

[[check]]
ac = "AC-2"
kind = "live_route"
selector = "input[placeholder='e.g. Englischer Garten']"
value = "Englischer Garten"
origin = "Marienplatz, Munich"
viewport = "mobile"
note = "search -> route works on the public deployment"
