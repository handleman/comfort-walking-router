# 004 AC-3: manual override is persisted through the prefs endpoint, so it needs
# the local Postgres. `make accept-live` runs this only when DATABASE_URL is up.
[target]
kind = "local"
requires_db = true

[[check]]
ac = "AC-3"
kind = "live_route"
selector = "input[placeholder='e.g. Englischer Garten']"
value = "Englischer Garten"
viewport = "desktop"
note = "a route first, so the summary/chip exists"

[[check]]
ac = "AC-3"
kind = "click"
selector = "section.prefs:visible button:has-text('Edit preferences')"
viewport = "desktop"

[[check]]
ac = "AC-3"
kind = "select"
selector = "section.prefs:visible select"
value = "hot"
viewport = "desktop"

[[check]]
ac = "AC-3"
kind = "click"
selector = "section.prefs:visible button:has-text('Save preferences')"
viewport = "desktop"

[[check]]
ac = "AC-3"
kind = "live_route"
selector = "input[placeholder='e.g. Englischer Garten']"
value = "Marienplatz, Munich"
origin = "Englischer Garten"
viewport = "desktop"
note = "distinct pair so auto-plan re-runs with the manual preference"

[[check]]
ac = "AC-3"
kind = "text"
selector = "section.route-summary:visible .chip"
expect = "Manual:"
viewport = "desktop"
