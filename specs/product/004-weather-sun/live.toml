# 004 AC-3: manual override is persisted through the prefs endpoint, so it needs
# the local Postgres. `make accept-live` runs this only when DATABASE_URL is up.
[target]
kind = "local"
requires_db = true

[[check]]
ac = "AC-3"
kind = "live_route"
selector = "input[placeholder='e.g. Englischer Garten']"
value = "Englischer Garten"
viewport = "desktop"
note = "a route first, so the summary/chip exists"

[[check]]
ac = "AC-3"
kind = "click"
selector = "[data-testid='comfort-panel'] [data-testid='shade-more']"
viewport = "desktop"
note = "041: More shade is the manual hot preference (desktop applies immediately)"

[[check]]
ac = "AC-3"
kind = "live_route"
selector = "input[placeholder='e.g. Englischer Garten']"
value = "Marienplatz, Munich"
origin = "Englischer Garten"
viewport = "desktop"
note = "distinct pair so auto-plan re-runs with the manual preference"

[[check]]
ac = "AC-3"
kind = "click"
selector = "section.route-summary details summary"
viewport = "desktop"
note = "041: the chip lives in the closed route details"

[[check]]
ac = "AC-3"
kind = "text"
selector = "section.route-summary:visible .chip"
expect = "Manual:"
viewport = "desktop"
