# 004: the summary chip renders applied_preference + preference_source; the
# manual override needs the prefs endpoint (Postgres) and lives in live.toml.
[[check]]
ac = "AC-1"
kind = "route_request"
selector = "input[placeholder='e.g. Englischer Garten']"
value = "Englischer Garten"
viewport = "desktop"
note = "plan a route so the summary/chip exists"

[[check]]
ac = "AC-1"
kind = "click"
selector = "section.route-summary details summary"
viewport = "desktop"
note = "041: the chip lives in the closed route details"

[[check]]
ac = "AC-1"
kind = "text"
selector = "section.route-summary:visible .chip"
expect = "Auto:"
viewport = "desktop"
note = "preference_source=auto is rendered"

[[check]]
ac = "AC-1"
kind = "text"
selector = "section.route-summary:visible .chip"
expect = "°C"
viewport = "desktop"
note = "the weather snapshot is rendered"

[[not_applicable]]
ac = "AC-2"
note = "auto-rule is unit-tested with fixtures, not a browser surface"

[[check]]
ac = "AC-3"
kind = "exists"
selector = "[data-testid='comfort-panel']"
viewport = "desktop"

[[not_applicable]]
ac = "AC-4"
note = "cache/TTL is backend behaviour"

[[not_applicable]]
ac = "AC-5"
note = "pytest/ruff/mypy gates"
