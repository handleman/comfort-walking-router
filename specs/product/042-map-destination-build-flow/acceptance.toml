# 042 is interaction-first: the map pick, delayed spinner, dissolve and failure
# are the e2e oracle (frontend/e2e/build-route.spec.ts). AC-1..5 and AC-7 are
# covered_by it; AC-6 (scrim stacking) stays a declared N/A because a map
# coordinate is not a stable selector. The app-wide console check still runs.

[[check]]
ac = "AC-8"
kind = "console_errors"
expect = 0
viewport = "both"
note = "The new flow must not introduce console errors on load"

[[covered_by]]
ac = "AC-1"
test = "frontend/e2e/build-route.spec.ts"

[[covered_by]]
ac = "AC-2"
test = "frontend/e2e/build-route.spec.ts"

[[covered_by]]
ac = "AC-3"
test = "frontend/e2e/build-route.spec.ts"

[[covered_by]]
ac = "AC-4"
test = "frontend/e2e/build-route.spec.ts"

[[covered_by]]
ac = "AC-5"
test = "frontend/e2e/build-route.spec.ts"

[[not_applicable]]
ac = "AC-6"
note = "scrim stacking is exercised by the 041 preferences e2e; this AC remains a declared N/A"

[[covered_by]]
ac = "AC-7"
test = "frontend/e2e/build-route.spec.ts"

