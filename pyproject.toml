# Root lint config. The constitution gates on `ruff check .` clean; the ignores
# below are scoped to harness files where broad-except resilience is deliberate:
# event listeners and the TUI must never crash the pilot on transient LLM/tool
# errors, and gate/flow fallbacks map failures to codes, not tracebacks.
[tool.pytest.ini_options]
# `pytest` at the root runs the app suite; the harness suite has its own venv
# (CrewAI) and runs explicitly: make swarm-test.
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"swarm/events.py" = ["BLE001", "S110"]
"swarm/tui.py" = ["BLE001", "S110"]
"swarm/flow.py" = ["BLE001"]
"swarm/llms.py" = ["BLE001", "S110"]

[tool.mypy]

# alembic ships no py.typed stubs and sqlalchemy is not importable in the lint
# env (DB-backed tests skip without DATABASE_URL). Scoped per-module override,
# not a blanket ignore.
[[tool.mypy.overrides]]
module = ["alembic", "alembic.*", "sqlalchemy", "sqlalchemy.*"]
ignore_missing_imports = true
