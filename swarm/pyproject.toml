[project]
name = "swarm"
version = "0.1.0"
description = "Free-first CrewAI swarm harness (009) — implements specs task-by-task"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[litellm]",
    "crewai-tools",
    "textual",
    "python-dotenv",
    "rich",
    # The ssh transport fallback (swarm/pyssh.py): an agent shell may be unable
    # to start /usr/bin/ssh at all, and the harness still has to push.
    "paramiko",
    "pynacl",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# This is a dependency-only install (`swarm[dev]`); the harness is imported as
# `swarm.*` from the repo root. Stop setuptools flat-layout discovery from
# treating source dirs (docker/, ollama/) as packages.
[tool.setuptools]
packages = []
py-modules = []
