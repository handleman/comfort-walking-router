# comfort-walking-router — the app's contract (048 AC-4).
# The harness defaults reproduce this file; declaring it makes the target
# explicit and lets the factory release replace the vendored swarm/.
specs_dir: specs/product
scope:
  - app/
  - frontend/
  - tests/
  - contracts/
  - requirements-dev.txt
  - requirements.txt
  - pyproject.toml
  - .gitignore
frontend_dirs: [app/, frontend/src/, frontend/lib/, frontend/]
e2e_root: frontend
e2e_dir: e2e
lock_dir: frontend
runs_dir: harness/runs
gates:
  - pytest -q
  - ruff check .
  - mypy app tests
  - npm --prefix frontend run check
  - npm --prefix frontend run lint
  - npm --prefix frontend test -- --run
  - npm --prefix frontend ci --dry-run
e2e:
  command: npm --prefix frontend run test:e2e
  specs: frontend/e2e
gate_map:
  'app/**': [pytest -q, ruff check ., mypy app tests]
  'tests/**': [pytest -q, ruff check ., mypy app tests]
  'contracts/**': [pytest -q]
  'frontend/**': [npm --prefix frontend run check, npm --prefix frontend run lint, npm --prefix frontend test -- --run]
risk:
  profile: comfort-walking-router
  classes:
    1: [tests/, frontend/e2e/, e2e/]
    2: [app/, frontend/src/, frontend/lib/, contracts/]
    3: [swarm/, specs/, .github/, docker/, requirements, pyproject.toml, app/auth, auth, migrations, payments, secrets, infra]
db:
  script: harness/db.sh
python:
  venv: .venv
harness_specs:
  - 009-swarm-harness
  - 012-dark-factory-harness
  - 013-dark-factory-phase-2
  - 015-dark-factory-economics
  - 016-conflict-recovery
  - 017-coder-selfcheck
  - 018-operator-readable-runs
  - 019-scenario-verifier
  - 020-harness-efficiency
  - 021-fix-loop
  - 022-lean-loop
  - 023-parallel-factory
  - 024-earned-autonomy
  - 025-durable-journal
  - 026-run-guards
  - 027-e2e-self-heal
  - 030-operator-runbooks
  - 031-dashboard-update
  - 032-spec-kind
  - 033-planner-coder-chain
  - 034-spec-folders

drivers:
  e2e: "./drivers/e2e.sh"
  db: "harness/db.sh"

# 057/041: Figma design lane. `hq design sync` writes designs/<key>/ for the
# queue; `hq figma auth` is only needed when no FIGMA_TOKEN is present.
# See docs/figma.md.
design:
  provider: figma
  transport: auto            # token-first: FIGMA_TOKEN → REST, else MCP OAuth
  file_key: "jFwR8VpN5Nls2RjN2Ifh4y"
  nodes:
    - "6:61"                 # Desktop · Your walk (1440×900)
    - "6:53"                 # Mobile · Your walk (390×844)
    - "6:57"                 # Mobile · Comfort preferences (390×844)
  token_env: FIGMA_TOKEN     # REST only
  dir: designs
  scale: 2
  auth:
    timeout_s: 600
    open_browser: true
